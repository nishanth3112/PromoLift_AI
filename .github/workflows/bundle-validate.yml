name: Bundle validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    # Forks and Dependabot get no secrets, so there is nothing to validate with. Dependabot
    # only bumps the pinned actions, which this check (of databricks.yml) does not read.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Databricks CLI
        uses: databricks/setup-cli@2bf4520fd10723ed5a22eca62a8c8a63714a7ba9 # v1.21.0
        with:
          version: 1.21.0

      # The credentials reach only this step, which stops at the first failure.
      - name: Validate the dev and prod targets
        run: |
          databricks bundle validate --target dev --strict
          databricks bundle validate --target prod --strict
        env:
          DATABRICKS_AUTH_TYPE: oauth-m2m
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
